<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBG Price Converter</title>
  <style>
    :root {
      --surface-base: oklch(0.97 0.01 95);
      --surface-card: oklch(0.94 0.012 90);
      --ink-strong: oklch(0.3 0.03 250);
      --ink: oklch(0.4 0.02 250);
      --accent: oklch(0.72 0.13 82);
      --line: oklch(0.8 0.02 85);
      --line-strong: oklch(0.62 0.05 248);
      --success-bg: oklch(0.91 0.05 155);
      --success-text: oklch(0.43 0.07 150);
      --danger-bg: oklch(0.92 0.04 28);
      --danger-text: oklch(0.47 0.11 26);
    }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      margin: 0;
      color: var(--ink);
      background-color: var(--surface-base);
      background-image:
        radial-gradient(circle at 1px 1px, oklch(0.84 0.02 86 / 0.45) 1px, transparent 0),
        linear-gradient(160deg, oklch(0.9 0.03 84 / 0.35) 0%, transparent 56%);
      background-size: 14px 14px, 100% 100%;
    }
    .popup-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-block: 16px;
    }
    .popup-header-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      flex-shrink: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 4px 0;
      color: var(--ink-strong);
      letter-spacing: 0.02em;
      flex: 1;
      min-width: 0;
    }
    h1::after {
      content: '';
      display: block;
      width: 44px;
      margin-top: 8px;
      border-bottom: 2px dashed var(--accent);
    }
    .subtitle {
      font-size: 12px;
      color: var(--ink);
      margin-bottom: 16px;
    }
    .status {
      padding: 9px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      border: 1px dashed var(--line-strong);
      font-weight: 600;
    }
    .status.enabled {
      background-color: var(--success-bg);
      color: var(--success-text);
    }
    .status.disabled {
      background-color: var(--danger-bg);
      color: var(--danger-text);
    }
    .info {
      font-size: 12px;
      color: var(--ink);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .conversion-info {
      background:
        linear-gradient(145deg, oklch(0.95 0.02 84 / 0.82), oklch(0.93 0.015 258 / 0.82)),
        repeating-linear-gradient(45deg, transparent 0 8px, oklch(0.86 0.03 82 / 0.18) 8px 10px);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      border: 1px solid var(--line);
    }
    .conversion-info strong {
      color: var(--ink-strong);
    }
    .settings-section {
      background: var(--surface-card);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
    }
    .settings-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-strong);
      margin-bottom: 8px;
    }
    .setting-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }
    .setting-row:last-child {
      margin-bottom: 0;
    }
    .setting-row input[type="checkbox"] {
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--line-strong);
    }
    .setting-row label {
      font-size: 12px;
      color: var(--ink);
      line-height: 1.4;
      cursor: pointer;
      flex: 1;
    }
    button {
      width: 100%;
      padding: 9px 16px;
      border: 1px solid var(--ink-strong);
      border-radius: 10px;
      background: var(--ink-strong);
      color: var(--surface-base);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease;
    }
    button:hover {
      transform: translateY(-1px);
      background: var(--ink);
    }
    button:active {
      transform: translateY(0);
    }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .popup-footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: oklch(0.54 0.015 245);
      border-top: 1px dashed var(--line);
      padding-top: 10px;
    }
    .popup-link {
      color: var(--line-strong);
      text-decoration: none;
      font-weight: 600;
    }
    .popup-link:hover {
      color: var(--ink-strong);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="popup-header">
    <img
      class="popup-header-logo"
      src="assets/images/logo512.png"
      alt=""
      width="48"
      height="48"
      decoding="async"
    >
    <h1 id="title">MBG Price Converter</h1>
  </header>
  <div id="status" class="status enabled">Enabled</div>
  <div class="conversion-info">
    <strong>Konversi:</strong> 1,2 × 10^12 Rupiah = 1 Hari MBG (nominal "triliun" = 10^12)
  </div>

  <div class="settings-section">
    <div class="settings-section-title">Pengaturan</div>
    <div class="setting-row">
      <input type="checkbox" id="rpOnlyCheckbox">
      <label for="rpOnlyCheckbox">Hanya deteksi nominal dengan prefix "Rp"</label>
    </div>
  </div>

  <div id="info" class="info">Version: <span id="version">1.0.0</span></div>
  <button id="toggleButton">Disable</button>
  <footer class="popup-footer">
    <a href="https://embiji.aksi.dev" target="_blank" class="popup-link">embiji.aksi.dev</a>
    <div style="margin-top: 2px;">© 2026</div>
  </footer>
  <script type="module" src="./popup.js"></script>
</body>
</html>
